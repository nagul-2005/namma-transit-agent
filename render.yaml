services:
  - type: web
    name: namma-transit-agent
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: FALLBACK_MODELS
        value: gemini-3.1-flash-lite, gemini-3.6-flash
